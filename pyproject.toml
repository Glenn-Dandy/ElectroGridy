[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electrogridy"
dynamic = ["version"]
description = "CAD-style editor for single-line electrical diagrams"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Glenn-Dandy" }]
# PyQt6 comes from the distribution packages (python3-pyqt6, python3-pyqt6.qtsvg).
dependencies = []

[project.urls]
Homepage = "https://github.com/Glenn-Dandy/ElectroGridy"
Issues = "https://github.com/Glenn-Dandy/ElectroGridy/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
electrogridy = "electrogridy.app:main"

[tool.setuptools.dynamic]
version = { attr = "electrogridy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
electrogridy = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]
