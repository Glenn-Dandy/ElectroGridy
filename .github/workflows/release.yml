name: Release packages

# Publishing a GitHub release builds the packages:
#   pre-release vX.Y.Z-devN -> .deb and Windows installer attached (no snap)
#   release vX.Y.Z          -> .deb and Windows installer attached, snap published to "stable"
# Once the packages are attached, all other pre-releases are deleted with their tags:
# only the newest development build stays.
# Started by hand (workflow_dispatch) only the Windows installer is built, as a
# workflow artifact.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install Ubuntu packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyqt6 python3-pyqt6.qtsvg python3-pyqt6.qtpdf python3-pdfminer tesseract-ocr tesseract-ocr-deu python3-pytest fonts-dejavu-core
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src:tests
        run: python3 -m pytest -q -p no:cacheprovider
      - name: Build .deb
        run: packaging/build-deb.sh
      - name: Attach .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.deb --clobber

  snap:
    # Only real releases go to the Snap Store, and straight to stable.
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    needs: deb
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: snapcore/action-build@v1
        id: build
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: |
          python -m pip install --disable-pip-version-check PyQt6==6.9.1 pdfminer.six==20240706 pyinstaller==6.14.2 pillow==11.3.0 pytest==8.4.1
          python -c "from PyQt6.QtPdf import QPdfDocument; import pdfminer.high_level"
      - name: Fonts and README for the package
        # Windows has no DejaVu Sans; the program loads the shipped copy (same text
        # widths as on Linux).
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip -OutFile build\dejavu.zip
          Expand-Archive build\dejavu.zip build\dejavu
          $src = "build\dejavu\dejavu-fonts-ttf-2.37"
          $fonts = "src\sldgridy\resources\fonts"
          New-Item -ItemType Directory -Force $fonts | Out-Null
          Copy-Item "$src\ttf\DejaVuSans.ttf", "$src\ttf\DejaVuSans-Bold.ttf" $fonts
          Copy-Item "$src\LICENSE" "$fonts\LICENSE-DejaVu.txt"
          Copy-Item README.md src\sldgridy\resources\README.md
      - name: Tesseract for texts in pictures
        # Shipped in the program folder with German and English language data; on the
        # PATH for the tests.
        run: |
          choco install tesseract --version 5.5.3.20260724 -y --no-progress
          $exe = Get-ChildItem "$env:ProgramFiles\Tesseract-OCR\tesseract.exe", "${env:ProgramFiles(x86)}\Tesseract-OCR\tesseract.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "tesseract.exe not found" }
          $t = $exe.DirectoryName
          Invoke-WebRequest https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/deu.traineddata -OutFile "$t\tessdata\deu.traineddata"
          $dst = "build\tesseract"
          New-Item -ItemType Directory -Force "$dst\tessdata" | Out-Null
          Copy-Item "$t\tesseract.exe", "$t\*.dll" $dst
          Copy-Item "$t\tessdata\configs" "$dst\tessdata\configs" -Recurse
          Copy-Item "$t\tessdata\eng.traineddata", "$t\tessdata\osd.traineddata", "$t\tessdata\deu.traineddata" "$dst\tessdata"
          $env:TESSDATA_PREFIX = (Resolve-Path "$dst\tessdata").Path
          $langs = & "$dst\tesseract.exe" --list-langs
          Write-Output $langs
          if (-not ($langs -contains "deu")) { throw "German language data missing" }
          Remove-Item Env:TESSDATA_PREFIX
          $t | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src;tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Build program
        run: |
          python packaging\windows\make_icon.py src\sldgridy\resources\icons\sldgridy.svg build\sldgridy.ico
          pyinstaller --noconfirm --windowed --name SLDGridy --icon build\sldgridy.ico --paths src --add-data "src\sldgridy\resources;sldgridy\resources" --add-data "build\tesseract;tesseract" --collect-data pdfminer --hidden-import PyQt6.QtPdf packaging\windows\sldgridy_main.py
      - name: Start the built program
        # Catches missing modules or files: the program must come up with its own
        # window, not with an error message, and keep running.
        run: |
          foreach ($dir in "library", "templates", "symbols", "i18n", "fonts") {
            if (-not (Test-Path "dist\SLDGridy\_internal\sldgridy\resources\$dir")) { throw "missing resources\$dir" }
          }
          if (-not (Test-Path "dist\SLDGridy\_internal\tesseract\tessdata\deu.traineddata")) { throw "missing tesseract" }
          $p = Start-Process dist\SLDGridy\SLDGridy.exe -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { throw "SLDGridy ended with exit code $($p.ExitCode)" }
          $titles = (Get-Process -Id $p.Id).MainWindowTitle
          Write-Output "Window: $titles"
          Get-Content "$env:LOCALAPPDATA\sldgridy\crash.log" -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force
          if ($titles -match "exception|error|fehler") { throw "error window: $titles" }
      - name: Build installer
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import sldgridy; print(sldgridy.__version__)"
          $numeric = ($version -split '\.')[0..2] -join '.'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" "/DNumericVersion=$numeric" packaging\windows\sldgridy.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Attach installer to the release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-Item dist\SLDGridy-*-setup.exe).FullName --clobber
      - name: Keep installer as workflow artifact
        if: ${{ github.event_name != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/SLDGridy-*-setup.exe

  cleanup:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    needs: [deb, windows]
    steps:
      - name: Delete older pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ github.event.release.tag_name }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 500 --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease and .tagName != env.CURRENT) | .tagName' |
          while read -r tag; do
            echo "deleting $tag"
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
