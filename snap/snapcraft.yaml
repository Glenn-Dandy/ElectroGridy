name: electrogridy
title: ElectroGridy
summary: Single-line diagrams for PV systems and transformer stations
description: |
  ElectroGridy draws single-line diagrams (one-line / Einstrich-Übersichtsschaltpläne)
  for photovoltaic systems, transformer stations and low-voltage distribution.

  * Symbol library to DIN EN 60617 plus common PV symbols (PV module, inverter,
    DC storage, wallbox, selective main switches)
  * Orthogonal wires that stay connected when devices are moved, wire labels,
    bus bars and junction dots
  * Blocks with attributes, block editor, own symbol libraries, DXF import
  * Sheets with title block and viewports, printing and export to PDF, SVG, PNG
  * English and German user interface

  ElectroGridy zeichnet einpolige Übersichtsschaltpläne für PV-Anlagen,
  Trafostationen und Niederspannungsverteilungen, auf Deutsch und Englisch.
license: GPL-3.0-or-later
website: https://github.com/Glenn-Dandy/ElectroGridy
source-code: https://github.com/Glenn-Dandy/ElectroGridy
issues: https://github.com/Glenn-Dandy/ElectroGridy/issues
contact: https://github.com/Glenn-Dandy/ElectroGridy/issues
donation: https://paypal.me/GlennDandy
icon: src/electrogridy/resources/icons/electrogridy.svg
adopt-info: electrogridy
base: core24
grade: stable
confinement: strict
platforms:
  amd64:

apps:
  electrogridy:
    command: bin/electrogridy-launch
    desktop: usr/share/applications/electrogridy.desktop
    common-id: io.github.glenn_dandy.ElectroGridy
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - network
      - cups

parts:
  electrogridy:
    plugin: nil
    source: .
    build-packages:
      - python3
    stage-packages:
      - python3
      - python3-pyqt6
      - python3-pyqt6.qtsvg
      - libqt6svg6
      - python3-pyqt6.qtpdf
      - libqt6pdf6
      - python3-pdfminer
      - tesseract-ocr
      - tesseract-ocr-deu
      - qt6-wayland
      - qt6-qpa-plugins
      - qt6-translations-l10n
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxkbcommon-x11-0
      - fonts-dejavu-core
    override-build: |
      set -eu
      share="$CRAFT_PART_INSTALL/usr/share/electrogridy"
      install -d "$share"
      cp -r src/electrogridy "$share/electrogridy"
      find "$share" -name __pycache__ -type d -prune -exec rm -rf {} +
      # Library and templates live next to the module, as in the .deb.
      for d in library templates; do
        if [ -d "$share/electrogridy/resources/$d" ]; then
          mv "$share/electrogridy/resources/$d" "$share/$d"
        fi
      done
      install -D -m 0644 packaging/electrogridy.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/electrogridy.desktop"
      install -D -m 0644 src/electrogridy/resources/icons/electrogridy.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/electrogridy.svg"
      install -D -m 0755 snap/local/electrogridy-launch "$CRAFT_PART_INSTALL/bin/electrogridy-launch"
      # Help > README inside the program, and the file type for the double-click setup
      # described there (a snap cannot register it itself).
      install -D -m 0644 README.md "$share/electrogridy/resources/README.md"
      install -D -m 0644 packaging/electrogridy.xml \
        "$CRAFT_PART_INSTALL/usr/share/mime/packages/electrogridy.xml"
      version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/electrogridy/__init__.py)"
      craftctl set version="$version"
